<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="교토오사카">
<title>교토·오사카 가족여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --ink:#1A211E; --muted:#5E6A64; --line:#D3D9D2; --soft:#E2E6E0;
  --kyoto:#3E6A48; --osaka:#2E4E97; --accent:#C93B25;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A201D; --ink:#E6EBE7; --muted:#9BA69F; --line:#2B3430; --soft:#232A26;
    --kyoto:#86B791; --osaka:#90AAEE; --accent:#F06A50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6EBE7; --muted:#9BA69F; --line:#2B3430; --soft:#232A26;
  --kyoto:#86B791; --osaka:#90AAEE; --accent:#F06A50; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.serif{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--osaka);outline-offset:2px;border-radius:6px}
.main{max-width:600px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:20px;padding-right:20px}
img{max-width:100%}

/* header */
.top{padding:22px 20px 14px}
.top h1{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-0.015em;margin:0}

.top .status{margin:2px 0 0;font-size:15px;font-weight:600}
.ro-note{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

/* route line (day selector) */
.route{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 8px 8px;border-bottom:1px solid var(--line)}
.route-cities{display:grid;grid-template-columns:repeat(5,1fr);font-size:12px;font-weight:600;margin:0 0 8px;text-align:center}
.rc-k{grid-column:1/3;color:var(--kyoto)}
.rc-m{grid-column:3/4;color:var(--muted);font-weight:500}
.rc-o{grid-column:4/6;color:var(--osaka)}
.stations{display:grid;grid-template-columns:repeat(5,1fr)}
.st{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0 0 4px;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-height:66px}
.st::before{content:"";position:absolute;top:9px;height:5px;left:0;right:0;background:var(--seg)}
.st:first-child::before{left:50%}
.st:last-child::before{right:50%}
.st--kyoto{--seg:var(--kyoto);--mark:var(--kyoto)}
.st--osaka{--seg:var(--osaka);--mark:var(--osaka)}
.st--move{--seg:linear-gradient(90deg,var(--kyoto),var(--osaka));--mark:var(--ink)}
.st-mark{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;background:var(--bg);border:4px solid var(--mark);transition:transform .18s ease,background-color .18s ease}
.st--move .st-mark{width:36px;border-radius:12px}
.st[aria-selected="true"] .st-mark{background:var(--mark);transform:scale(1.12)}
.st-d{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:21px;font-weight:700;line-height:1}
.st-w{font-size:12px;color:var(--muted);line-height:1}
.st[aria-selected="true"] .st-w{color:var(--ink);font-weight:600}
.st.is-today .st-w{color:var(--accent);font-weight:600}

/* day */
.day-head{padding:20px 20px 6px}
.day-date{margin:0;font-size:14px;color:var(--muted)}
.day-head h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:25px;line-height:1.25;margin:2px 0 0;letter-spacing:-0.01em}
.day-res{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
.day-res::-webkit-scrollbar{display:none}
.rchip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.rchip-k{color:var(--muted);font-size:13px}
.rchip.is-missing{border-style:dashed}
.rchip.is-missing::after{content:"입력 전";font-size:12px;color:var(--accent)}

.timeline{list-style:none;margin:8px 0 0;padding:4px 20px 0;position:relative}
.timeline::before{content:"";position:absolute;left:calc(20px + 54px + 10px + 8px);top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--line-city)}
.day--kyoto{--line-city:var(--kyoto);--dot:var(--kyoto)}
.day--osaka{--line-city:var(--osaka);--dot:var(--osaka)}
.day--move{--line-city:linear-gradient(180deg,var(--kyoto),var(--osaka));--dot:var(--ink)}
.ev{display:grid;grid-template-columns:54px 20px 1fr;column-gap:10px;padding:9px 0}
.ev-time{text-align:right;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.ev-rail{display:flex;justify-content:center}
.ev-dot{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--dot);margin-top:5px;box-shadow:0 0 0 4px var(--bg)}
.ev--move .ev-dot{background:var(--bg);border:3px solid var(--dot);width:12px;height:12px;margin-top:6px}
.ev-body{min-width:0;border-radius:10px;margin:-4px -8px;padding:4px 8px}
.ev-body[role="button"]{cursor:pointer}
.ev-body[role="button"]:active{background:var(--soft)}
.ev-title{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.ev--move .ev-title{font-size:15px;font-weight:500;color:var(--muted)}
.ev-memo{margin:3px 0 0;font-size:14px;color:var(--muted);line-height:1.55}
.maplink{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:14px;font-weight:500;color:var(--dot);text-decoration:none;padding:2px 0}
.day--move .maplink{color:var(--osaka)}
.maplink svg{width:14px;height:14px}
.add{display:block;margin:10px 20px 0 94px;padding:10px 14px;width:calc(100% - 114px);text-align:left;background:none;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:500;cursor:pointer}
.add.wide{margin:12px 0 0;width:100%}

/* pages */
.page-head{padding:24px 20px 4px}
.page-head h1{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:30px;line-height:1.15;margin:0;letter-spacing:-0.015em}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.group-label{margin:24px 20px 8px;font-size:14px;font-weight:600;color:var(--muted)}
.list{margin:0 16px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;text-decoration:none}
.list > .row:first-child{border-top:0}
button.row{cursor:pointer}
button.row:active,a.row:active{background:var(--soft)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;line-height:1.4}
.row-sub{font-size:14px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row-k{font-size:13px;color:var(--muted);margin-bottom:1px}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px dashed var(--accent);color:var(--accent)}
.chev{flex:none;color:var(--muted);width:16px;height:16px}
.row-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--osaka)}
.text-block{padding:14px 16px;white-space:pre-wrap;font-size:15px}
.text-block.empty{color:var(--muted)}

/* checklist */
.progress{margin:14px 20px 0;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--kyoto);border-radius:3px;transition:width .25s ease}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:none}
.is-done .ck{background:var(--kyoto);border-color:var(--kyoto)}
.ck svg{width:14px;height:14px;color:var(--bg);opacity:0}
.is-done .ck svg{opacity:1}
.is-done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;font-weight:500}
.x{flex:none;border:0;background:var(--soft);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.add-row{display:flex;gap:8px;margin:12px 16px 0}
.add-row input{flex:1}
.link-btn{background:none;border:0;color:var(--osaka);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
.head-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:30;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,15,12,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:23px;line-height:1.3;margin:0}
.sheet .sub{margin:4px 0 16px;color:var(--muted);font-size:14px}
.kv{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center}
.kv:first-of-type{margin-top:16px}
.kv-main{flex:1;min-width:0}
.kv-k{font-size:13px;color:var(--muted)}
.kv-v{font-size:16px;word-break:break-word;white-space:pre-wrap}
.kv-v.big{font-size:20px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kv-v.empty{color:var(--muted)}
.mini{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;height:50px;border-radius:13px;border:0;font-weight:600;font-size:16px;cursor:pointer}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-danger{background:none;color:var(--accent);border:1px solid var(--line);flex:0 0 auto;padding:0 18px}

/* taxi card */
.taxi{position:fixed;inset:0;z-index:50;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 26px calc(24px + env(safe-area-inset-bottom,0px));font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;cursor:pointer}
.taxi .t1{font-size:22px;margin:0 0 18px;color:#444}
.taxi .t2{font-size:34px;font-weight:700;line-height:1.3;margin:0}
.taxi .t3{font-size:24px;line-height:1.45;margin:18px 0 0;font-weight:600;word-break:break-all}
.taxi .t4{font-size:18px;margin:14px 0 0;color:#444}
.taxi .close{margin-top:auto;font-family:"IBM Plex Sans KR",sans-serif;color:#666;font-size:15px;text-align:center;padding-top:24px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (min-width:640px){.top h1{font-size:40px}}

/* today */
.tabs-in{grid-template-columns:repeat(5,1fr)}
.today-head .status{margin:6px 0 0;font-size:15px;font-weight:600}
.today-head h1{font-size:32px}
.peek{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.peek span{flex:1;text-align:center}
.mini[disabled]{opacity:.35}
.mini svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}

.now{margin:18px 16px 0;padding:18px;border-radius:18px;background:var(--surface);border:2px solid var(--accent)}

.now h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:24px;line-height:1.3;margin:4px 0 0}

.next{margin:10px 16px 0;padding:14px 18px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.hotel{margin:12px 16px 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tlist{list-style:none;margin:0 16px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tev{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:16px 16px 16px 12px;border-top:1px solid var(--line)}
.tev:first-child{border-top:0}
.tev-time{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--dot);padding-top:18px}
.tev h3{margin:2px 0 0;font-size:18px;line-height:1.4}

.tev-memo{margin:6px 0 0;font-size:15px;color:var(--muted)}
.tev.is-past{opacity:.5}
.tev.is-cur{background:var(--soft)}
.link-btn.small{font-size:13px;color:var(--muted);font-weight:500;margin-top:8px}
@keyframes spin{to{transform:rotate(360deg)}}
/* offline build */
.banner{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--ink)}
.banner span{flex:1}
.foot{margin:10px 20px 0;font-size:13px;color:var(--muted)}

.sync{display:grid;gap:8px;margin:16px 16px 0}
.sync-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;text-decoration:none;cursor:pointer;width:100%;color:var(--ink)}
.sync-btn:active{background:var(--soft)}
.sync-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--osaka);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.sync-btn b{display:block;font-weight:600}
.sync-btn small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.kv-note{font-size:14px;color:var(--muted);margin-top:1px}
textarea.short{min-height:64px}
.qr-kv{align-items:flex-start}
.qr-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qr-th{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
.qr-th img{width:100%;height:100%;object-fit:cover}
.qr-badge{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--osaka)}
.qr-all{width:100%;margin-top:14px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
.qr-all b{color:var(--osaka)}
.qrv{position:fixed;inset:0;z-index:55;background:#fff;color:#111;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.qrv-top{display:flex;align-items:flex-start;gap:12px}
.qrv-top>div{flex:1;min-width:0}
.qrv-t{font-weight:700;font-size:18px;line-height:1.35}
.qrv-n{font-size:14px;color:#666;min-height:20px}
.qrv-x{flex:none;border:0;background:#eee;color:#333;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer}
.qrv-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}
.qrv-img img{max-width:100%;max-height:100%;object-fit:contain}
.qrv-tip{margin:0 0 10px;text-align:center;font-size:13px;color:#666}
.qrv-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.qrv .mini{background:#f2f2f2;color:#111;border-color:#ddd}
.ev-route{display:grid;grid-template-columns:54px 20px 1fr;column-gap:10px;padding:2px 0 4px}

.rt{min-width:0;padding:8px 12px;border-radius:12px;background:var(--soft);font-size:14px}
.rt .maplink{margin-top:4px}
.rt-fields{border:1px solid var(--line);border-radius:12px;margin:16px 0 0;padding:4px 12px 12px}
.rt-fields legend{font-size:13px;color:var(--muted);padding:0 4px}
.cat{display:inline-block;font-size:13px;font-weight:700;line-height:1.3;padding:2px 9px;border-radius:6px;background:var(--cat-bg);color:var(--cat-fg);vertical-align:1px}
.row-k .cat{margin-right:8px}
.row-when{color:var(--muted)}
.sheet .sub .cat{margin-right:4px}
.cat--flight{--cat-fg:#2E4E97;--cat-bg:#E2E8F6}
.cat--hotel{--cat-fg:#3E6A48;--cat-bg:#DFEBE2}
.cat--rail{--cat-fg:#6B4FA0;--cat-bg:#ECE5F6}
.cat--food{--cat-fg:#B1501D;--cat-bg:#F7E5DA}
.cat--ticket{--cat-fg:#8C6300;--cat-bg:#F4EBD2}
.cat--etc{--cat-fg:#56625C;--cat-bg:#E4E8E3}

function resForDay(date){
  var out=[];
  state.reservations.forEach(function(r){
    if(!r.date) return;
    if(r.cat==='hotel' && r.endDate){
      if(r.date===date) out.push({r:r,tag:'체크인'});
      else if(r.endDate===date) out.push({r:r,tag:'체크아웃'});
      else if(r.date<date && date<r.endDate) out.push({r:r,tag:'숙박'});
    } else if(r.date===date || (r.endDate && r.date<=date && date<=r.endDate)) out.push({r:r,tag:CAT[r.cat]||'예약'});
  });
  return out;
}

function sortedRes(){
  return state.reservations.slice().sort(function(a,b){
    var ka=(a.date||'9999')+(a.time||'99:99'), kb=(b.date||'9999')+(b.time||'99:99');
    return ka<kb?-1:ka>kb?1:0;
  });
}

/* ---------- today ---------- */
function nowJST(){
  try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(/[^\d:]/g,'');}
  catch(e){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
}
function mins(hm){var p=hm.split(':');return (+p[0])*60+(+p[1]);}
function inHow(from,to){var m=mins(to)-mins(from);if(m<=0) return '곧';var h=Math.floor(m/60),r=m%60;return (h?h+'시간 ':'')+(r?r+'분':'')+' 뒤';}
function dirUrl(q){return 'https://www.google.com/maps/dir/?api=1&travelmode=transit&destination='+encodeURIComponent(q);}
function evQuery(ev){
  if(ev.map) return ev.map;
  var hotel=null; state.reservations.forEach(function(r){if(r.cat==='hotel'&&r.title===ev.place) hotel=r;});
  if(hotel) return hotel.address||'';
  return ev.place||'';
}
function hotelTonight(date){var h=null;state.reservations.forEach(function(r){if(r.cat==='hotel'&&r.date&&r.endDate&&r.date<=date&&date<r.endDate) h=r;});return h;}

function renderToday(){
  var days=state.days, t=todayJST(), live=-1;
  days.forEach(function(d,i){if(d.date===t) live=i;});
  var idx=live>=0?live:(ui.tday==null?0:Math.min(ui.tday,days.length-1));
  var d=days[idx], isLive=live>=0, now=nowJST();
  var cityName={kyoto:'교토',osaka:'오사카',move:'교토에서 오사카로'}[d.city];
  var cur=null,next=null;
  if(isLive){d.items.forEach(function(ev){if(!ev.time) return; if(ev.time<=now) cur=ev; else if(!next) next=ev;});}

  var head='<header class="page-head today-head day--'+d.city+'"><p class="day-date">'+
    (isLive?'오늘, ':'미리보기, ')+esc(md(d.date)+' '+wd(d.date)+'요일, '+cityName)+'</p>'+
    '<h1>'+esc(d.title)+'</h1><p class="status">'+esc(isLive?('여행 '+(idx+1)+'일째, 지금 '+now):statusText())+'</p>'+
    (isLive?'':'<div class="peek"><button class="mini" data-act="tday" data-i="'+(idx-1)+'"'+(idx===0?' disabled':'')+'>전날</button>'+
      '<span>'+(idx+1)+'일째 / '+days.length+'일</span><button class="mini" data-act="tday" data-i="'+(idx+1)+'"'+(idx===days.length-1?' disabled':'')+'>다음날</button></div>')+
    '</header>';

  var items=d.items.map(function(ev){
    var q=evQuery(ev), past=isLive&&ev.time&&cur&&ev.time<cur.time, isCur=cur===ev, isNext=isLive&&ev===next, ty=ev.type||'sight';
    var acts=((ev.memo||ev.placeOrig)?'<button class="act act--memo" data-act="memo-toggle">'+ICON.note+'<span>메모</span></button>':'')+(q?'<a class="act" href="'+esc(mapUrl(q))+'" target="_blank" rel="noopener">'+ICON.pin+'지도</a>':'')+
      (aboutOf(ev)?'<button class="act act--story" data-act="about" data-id="'+ev.id+'">'+ICON.book+'이곳 이야기</button>':'')+
      (typeof spChip==='function'?spChip(ev,d.date):'');
    return (routeOf(ev)?'<li class="tev-route'+(past?' is-past':'')+'">'+routeCard(d,ev,'today')+'</li>':'')+
      '<li class="tev tev--'+esc(ty)+(past?' is-past':'')+(isCur?' is-cur':'')+'"'+(past?' data-act="tev-toggle"':'')+'>'+
      '<div class="tev-head"><span class="tev-time">'+esc(ev.time||'시간 미정')+'</span><span class="tev-kind">'+(TYICON[ty]||'')+esc(TYPE[ty]||'')+'</span>'+
        (isCur?'<b class="pill pill--now">지금</b>':'')+(isNext?'<b class="pill pill--next">다음, '+esc(inHow(now,next.time))+'</b>':'')+(past?'<span class="tev-done">지난 일정</span>':'')+'</div>'+
      headHtml(ev,'h3','')+
      '<div class="tev-more">'+(ev.placeOrig?'<p class="tev-memo tev-orig">현지 이름: '+esc(ev.placeOrig)+'</p>':'')+memoHtml(ev.memo,'tev-memo')+
      (acts?'<div class="tev-acts">'+acts+'</div>':'')+'</div></li>';
  }).join('');

  return head+(typeof spDayLine==='function'?spDayLine(d.date):'')+hotelTop(d)+
    '<ol class="tlist day--'+d.city+'">'+startNode(d,'today')+items+'</ol>';
}

var SENS=/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{6,}\b|\d{9,}|01[016789]-?\d{3,4}-?\d{4}|[\w.+-]+@[\w-]+\.[\w.]+|(예약|확인|여권|카드|회원)\s*번호|비밀번호/;

    add(mdw(d.date)+' · '+d.title,'pv-h');

      add((ev.time?ev.time+' ':'')+evName(ev)+(ev.place&&ev.title&&ev.title!==ev.place?' ('+ev.title+')':''));

  });
  add('예약','pv-h');
  o.state.reservations.forEach(function(r){ add((r.date?mdw(r.date)+' ':'')+r.title+(r.nameOrig?' ('+r.nameOrig+')':'')); });
  PLK.forEach(function(k){ var l=o[PL[k].key]; if(l&&l.length){ add(PL[k].unit,'pv-h'); l.forEach(function(b){ add(b.name+(b.nameOrig?' ('+b.nameOrig+')':'')); memoLines(b.memo).forEach(function(m){ add(m,'pv-s'); }); }); } });

}

function sharePublish(o){
  var tok=lsGet(LS_GHTOKEN);
  return gh('/git/ref/heads/'+GH_BRANCH,{},tok).then(function(r){
    if(r.ok) return;
    // first time: make the share branch from main
    return gh('/git/ref/heads/main',{},tok).then(function(m){ if(!m.ok) throw m; return m.json(); }).then(function(j){
      return gh('/git/refs',{method:'POST',body:JSON.stringify({ref:'refs/heads/'+GH_BRANCH,sha:j.object.sha})},tok);
    });
  }).then(function(){ return gh('/contents/'+GH_FILE+'?ref='+GH_BRANCH,{},tok); })
  .then(function(r){ return r.ok?r.json():null; })
  .then(function(cur){
    var body={message:'가족 공유 업데이트',content:b64(JSON.stringify(o)),branch:GH_BRANCH}; if(cur&&cur.sha) body.sha=cur.sha;
    return gh('/contents/'+GH_FILE,{method:'PUT',body:JSON.stringify(body)},tok);
  }).then(function(r){
    if(!r.ok) throw r;
    lsSet(LS_PUBAT,o.publishedAt); lsSet(LS_SHAREHASH,hashStr(shareSig(o)));
  });
}
function shareGo(btn){
  var o=pendingShare; if(!lsGet(LS_GHTOKEN)){ tokenSheet(); return; } if(!o) return;
  if(btn){ btn.disabled=true; btn.textContent='올리는 중…'; }
  sharePublish(o).then(function(){
    lsSet(LS_SHAREOK,warnSig(o)); pendingShare=null; closeSheet(); render(); toast('가족 앱에 공유했어요. 가족이 앱을 다시 열면 보여요',true);
  }).catch(function(e){
    var s=e&&e.status;
    if(btn){ btn.disabled=false; btn.textContent='다시 올리기'; }
    toast(!navigator.onLine?'인터넷 연결을 확인해 주세요':s===401?'토큰이 맞지 않거나 만료됐어요. 토큰 바꾸기를 눌러 주세요':(s===403||s===404)?'토큰에 이 저장소 쓰기 권한이 없어요 (Contents: Read and write)':'올리지 못했어요'+(s?' ('+s+')':''),true);

var LS_AUTOSHARE='kyosaka:autoShare', LS_SHAREHASH='kyosaka:shareHash', LS_SHAREOK='kyosaka:shareOk', autoT=null, autoBusy=false;
function autoOn(){ return !FAMILY&&!!lsGet(LS_GHTOKEN)&&lsGet(LS_AUTOSHARE)!=='off'; }
function hashStr(s){ var h=0; for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return String(h); }
function shareSig(o){ var c=Object.assign({},o); delete c.publishedAt; return JSON.stringify(c); }
function warnSig(o){ return shareLines(o).filter(function(x){return x.w;}).map(function(x){return x.t;}).sort().join('\n'); }
function shareBlocked(){ var o=shareData(), w=warnSig(o); return !!w&&w!==(lsGet(LS_SHAREOK)||''); }
function autoShareSoon(){ if(!autoOn()) return; clearTimeout(autoT); autoT=setTimeout(autoShareNow,4000); }
function autoShareNow(){
  clearTimeout(autoT); autoT=null;
  if(!autoOn()||autoBusy||!navigator.onLine) return;
  var o=shareData(); if(hashStr(shareSig(o))===lsGet(LS_SHAREHASH)) return;
  var w=warnSig(o);
  if(w&&w!==(lsGet(LS_SHAREOK)||'')){
    if(lsGet('kyosaka:shareWarned')!==w){ lsSet('kyosaka:shareWarned',w); toast('가족 공유: 예약번호나 개인정보처럼 보이는 줄이 있어서 자동으로 올리지 않았어요. 정보 탭에서 확인해 주세요',true); }
    if(ui.tab==='info') render(); return;
  }
  autoBusy=true;
  sharePublish(o).then(function(){ try{ localStorage.removeItem('kyosaka:shareErr'); }catch(e){} if(ui.tab==='info') render(); })
    .catch(function(e){ var s=e&&e.status; lsSet('kyosaka:shareErr',s===401?'토큰이 맞지 않거나 만료됐어요':(s===403||s===404)?'토큰에 저장소 쓰기 권한이 없어요':!navigator.onLine?'인터넷이 없어서 못 올렸어요':'올리지 못했어요'+(s?' ('+s+')':'')); if(ui.tab==='info') render(); })
    .then(function(){ autoBusy=false; });
}// get the newest app now instead of closing and reopening it
function appRefresh(btn){
  if(!navigator.onLine){ toast('인터넷이 연결되면 새 버전을 받을 수 있어요'); return; }

  var cur=+((String(btn.parentNode.textContent).match(/앱 버전 (\d+)/)||[])[1]||0);
  var upd=(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)?navigator.serviceWorker.getRegistration().then(function(r){ return r&&r.update(); }).catch(function(){}):Promise.resolve();
  var get=fetch('./index.html?fresh='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).catch(function(){ return ''; });
  Promise.all([upd,get]).then(function(x){

/* ---------- QR images (kept only on this phone, in IndexedDB) ---------- */
var QR={}, qrUrls={}, qrDbP=null, qrView=null;
function qrDb(){
  if(qrDbP) return qrDbP;
  qrDbP=new Promise(function(res,rej){
    try{ var rq=indexedDB.open('kyosaka',1);
      rq.onupgradeneeded=function(){ var d=rq.result; if(!d.objectStoreNames.contains('qr')) d.createObjectStore('qr',{keyPath:'id'}); };
      rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);};
    }catch(e){rej(e);}
  });
  return qrDbP;
}
function qrTx(mode,fn){ return qrDb().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction('qr',mode), st=t.objectStore('qr'), out=fn(st); t.oncomplete=function(){res(out&&out.result);}; t.onerror=function(){rej(t.error);}; }); }); }
function qrLoad(){
  return qrTx('readonly',function(st){return st.getAll();}).then(function(all){
    QR={}; (all||[]).sort(function(a,b){return a.added-b.added;}).forEach(function(q){ (QR[q.res]=QR[q.res]||[]).push(q); });
    render();
  }).catch(function(){});
}
function qrUrl(q){ if(!qrUrls[q.id]) qrUrls[q.id]=URL.createObjectURL(q.blob); return qrUrls[q.id]; }
function qrCount(id){ return (QR[id]||[]).length; }
function qrAdd(resId,files){
  var list=Array.prototype.slice.call(files||[]).filter(function(f){return /^image\//.test(f.type);});
  if(!list.length){ toast('이미지 파일을 골라 주세요'); return; }
  var now=Date.now();
  var recs=list.map(function(f,i){ return {id:uid('q'),res:resId,blob:f,added:now+i}; });
  qrTx('readwrite',function(st){ recs.forEach(function(r){st.put(r);}); }).then(function(){
    recs.forEach(function(r){ (QR[resId]=QR[resId]||[]).push(r); });
    toast((resId.indexOf('ck:')===0?'사진 ':'QR ')+recs.length+'장을 저장했어요'); if(resId.indexOf('ck:')!==0) resDetail(resId); render();
  }).catch(function(){ toast('저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요'); });
}
function qrDelete(q){
  qrTx('readwrite',function(st){ st.delete(q.id); }).then(function(){
    QR[q.res]=(QR[q.res]||[]).filter(function(x){return x.id!==q.id;});
    if(qrUrls[q.id]){ URL.revokeObjectURL(qrUrls[q.id]); delete qrUrls[q.id]; }
    toast('지웠어요'); render();
    if(qrView){ qrView.list=qrView.list.filter(function(x){return x.id!==q.id;}); if(!qrView.list.length) qrClose(); else { qrView.i=Math.min(qrView.i,qrView.list.length-1); qrDraw(); } }
  });
}
function ckTitleObj(key){ if(String(key).indexOf('ck:')!==0) return null; var id=key.slice(3), c=state.checklist.filter(function(x){return x.id===id;})[0]; return {title:c?c.text:'준비물 사진'}; }
function qrAllList(){ var out=[]; sortedRes().forEach(function(r){ (QR[r.id]||[]).forEach(function(q){out.push(q);}); }); state.checklist.forEach(function(c){ (QR['ck:'+c.id]||[]).forEach(function(q){out.push(q);}); }); return out; }
function qrOpen(list,i){ if(!list.length) return; qrView={list:list,i:i||0,armed:false}; qrDraw(); }
function qrClose(){ var el=document.querySelector('.qrv'); if(el) el.remove(); qrView=null; }
function qrDraw(){
  var v=qrView, q=v.list[v.i], r=findRes(q.res)||ckTitleObj(q.res), el=document.querySelector('.qrv');
  if(!el){ el=document.createElement('div'); el.className='qrv'; el.setAttribute('role','dialog'); document.body.appendChild(el); }
  el.innerHTML='<div class="qrv-top"><div><div class="qrv-t">'+esc(r?r.title:'QR')+'</div><div class="qrv-n">'+(v.list.length>1?(v.i+1)+' / '+v.list.length:'')+'</div></div><button class="qrv-x" data-act="qr-close" aria-label="닫기">×</button></div>'+
    '<div class="qrv-img"><img src="'+qrUrl(q)+'" alt="QR 이미지"></div>'+
    '<p class="qrv-tip">화면 밝기를 최대로 올리면 잘 읽혀요</p>'+
    '<div class="qrv-btns">'+(v.list.length>1?'<button class="mini" data-act="qr-prev"'+(v.i===0?' disabled':'')+'>이전</button>':'')+
    '<button class="mini" data-act="qr-share">보내기</button><button class="mini" data-act="qr-del">'+(v.armed?'한 번 더 누르면 삭제':'삭제')+'</button>'+
    (v.list.length>1?'<button class="mini" data-act="qr-next"'+(v.i===v.list.length-1?' disabled':'')+'>다음</button>':'')+'</div>';
}
function qrShare(){
  var q=qrView&&qrView.list[qrView.i]; if(!q) return;
  var ext=(q.blob.type.split('/')[1]||'png').replace('jpeg','jpg'), r=findRes(q.res);
  try{ var f=new File([q.blob],'qr-'+(qrView.i+1)+'.'+ext,{type:q.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:r?r.title:'QR'}).catch(function(){}); return; }
  }catch(e){}
  toast('이 휴대폰에서는 보내기를 쓸 수 없어요');

function qrSection(r){

    '</div><label class="mini" style="cursor:pointer">추가<input type="file" accept="image/*" multiple data-import="qr" data-id="'+r.id+'" hidden></label></div>';
}

function geoQueries(ev){

var GEO_Q=[], GEO_BUSY=false, GEO_KEY='kyosaka:geo2:';
try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('kyosaka:geo:')===0) localStorage.removeItem(k); }); }catch(e){}
function geoCached(q){ try{ var v=localStorage.getItem(GEO_KEY+q); return v?JSON.parse(v):undefined; }catch(e){ return undefined; } }
function geoLookup(q){
  var c=geoCached(q); if(c!==undefined) return Promise.resolve(c);

  return new Promise(function(res){ GEO_Q.push({q:q,res:res}); geoPump(); });
}
// Japanese addresses/names: GSI (Japan's map agency) finds them to the house number; others: OpenStreetMap
function geoGsi(q){
  return fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(q))
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(j){ var c=j&&j[0]&&j[0].geometry&&j[0].geometry.coordinates; return c?{lat:+c[1],lng:+c[0]}:null; });
}
function geoOsm(q){
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=ko&countrycodes=jp&viewbox=134.9,35.3,136.2,34.2&bounded=1&q='+encodeURIComponent(q))
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(j){ return j&&j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null; });
}
function geoPump(){
  if(GEO_BUSY||!GEO_Q.length) return; GEO_BUSY=true;
  var job=GEO_Q.shift(), ja=/[\u3040-\u30FF\u4E00-\u9FFF]/.test(job.q), failed=false;
  function safe(p){ return p.catch(function(){ failed=true; return null; }); }
  (ja?safe(geoGsi(job.q)).then(function(v){ return (v&&inArea(v))?v:safe(geoOsm(job.q)); }):safe(geoOsm(job.q)))
    .then(function(v){
      v=v&&inArea(v)?v:null;
      if(v||!failed){ try{ localStorage.setItem(GEO_KEY+job.q,JSON.stringify(v)); }catch(e){} }
      job.res(v||(failed?undefined:null));
      setTimeout(function(){ GEO_BUSY=false; geoPump(); },1100);
    });
}

  return fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',
    headers:{'Content-Type':'application/json','X-Goog-Api-Key':gKey(),'X-Goog-FieldMask':'places.location'},
    body:JSON.stringify({textQuery:q,languageCode:'ko',regionCode:'JP',pageSize:1,locationBias:{rectangle:{low:{latitude:33.4,longitude:134.0},high:{latitude:36.3,longitude:137.0}}}})})
    .then(function(r){ if(!r.ok) throw r; return r.json(); })
    .then(function(j){
      var l=j&&j.places&&j.places[0]&&j.places[0].location, v=l?{lat:+l.latitude,lng:+l.longitude}:null;
      if(v&&!inArea(v)) v=null;
      try{ localStorage.setItem(GG_KEY+q,JSON.stringify(v)); }catch(e){}
      return v;
    }).catch(function(e){
      if(!ggWarned&&e&&e.status){ ggWarned=true; toast('구글 위치 찾기가 안 돼요 ('+e.status+'). 정보 탭에서 키를 확인해 주세요',true); }
      return undefined;
    });
}
function evCoord(ev){
  var m=String(ev.map||'').match(/^\s*(-?\d{1,2}\.\d+)\s*,\s*(-?\d{2,3}\.\d+)\s*$/);
  if(m) return Promise.resolve({lat:+m[1],lng:+m[2],via:'map'});
  if(gKey()) return ggLookup(gQuery(ev)).then(function(v){ return v?{lat:v.lat,lng:v.lng,via:ev.map?'map':'name'}:evCoordFree(ev); });
  return evCoordFree(ev);
}
function evCoordFree(ev){
  if(isFinite(+ev.lat)&&isFinite(+ev.lng)&&ev.lat!==''&&ev.lng!=null&&ev.lat!=null&&pinFresh(ev)) return Promise.resolve({lat:+ev.lat,lng:+ev.lng});
  var qs=geoQueries(ev), i=0;
  return new Promise(function(res){
    (function next(){ if(i>=qs.length) return res(null); var g=qs[i++]; geoLookup(g.q).then(function(v){ if(v) res({lat:v.lat,lng:v.lng,via:g.via}); else next(); }); })();
  });
}function mapPoints(dayIdxs){
  var pts=[];
  dayIdxs.forEach(function(di){ var d=state.days[di], n=0; d.items.forEach(function(ev){ n++; pts.push({ev:ev,day:di,n:n,date:d.date}); }); });
  return pts;
}
function renderMapView(){
  var all=ui.mapAll;
  return '<div class="mapbar"><div class="seg seg--sm"><label><input type="radio" name="mapscope" data-act="map-scope" data-v="day"'+(all?'':' checked')+'><span>이 날</span></label><label><input type="radio" name="mapscope" data-act="map-scope" data-v="all"'+(all?' checked':'')+'><span>5일 전체</span></label></div><span class="map-status" id="map-status"></span></div>'+
    '<div id="tripmap" class="tripmap"></div><div id="map-miss" class="map-miss"></div>'+
    '<p class="foot">지도는 인터넷이 필요해요. 한 번 본 곳은 휴대폰에 저장돼요. 지도 © OpenStreetMap</p>';
}
var DAYCOL=['#3E6A48','#5E8A3A','#1F6F8B','#2E4E97','#6B4FA0'];
var MAPRUN=0;
function inArea(c){ return c.lat>33.4&&c.lat<36.3&&c.lng>134.0&&c.lng<137.0; }
function drawMap(){
  var box=document.getElementById('tripmap'); if(!box) return;
  var st=document.getElementById('map-status');
  if(!navigator.onLine&&!window.L){ box.innerHTML='<div class="map-off">인터넷이 연결되면 지도를 볼 수 있어요</div>'; return; }
  loadLeaflet().then(function(L){
    if(!document.getElementById('tripmap')) return;
    if(MAP){ try{ MAP.remove(); }catch(e){} MAP=null; }
    MAP=L.map('tripmap',{zoomControl:true,attributionControl:true}).setView([34.95,135.65],10);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
    MAPLAYER=L.layerGroup().addTo(MAP);
    MAP.on('popupopen',function(pe){ var a=pe.popup.getElement().querySelector('[data-pop-edit]'); if(a) a.onclick=function(ev){ ev.preventDefault(); evForm(a.getAttribute('data-pop-edit')); }; });
    var days=ui.mapAll?state.days.map(function(_,i){return i;}):[ui.day];
    var pts=mapPoints(days), found=[], miss=[], done=0, run=++MAPRUN;
    if(st) st.textContent=pts.length?'위치 찾는 중… 0/'+pts.length:'';
    if(!pts.length){ if(st) st.textContent='이 날 일정이 없어요'; return; }
    pts.forEach(function(p){
      evCoord(p.ev).then(function(c){
        if(run!==MAPRUN) return;
        // places outside Kyoto/Osaka (e.g. the airport back home) are left off the map
        done++; if(c&&inArea(c)) found.push({p:p,c:c}); else if(!c) miss.push(p);
        if(st) st.textContent=done<pts.length?'위치 찾는 중… '+done+'/'+pts.length:(miss.length?miss.length+'곳은 위치를 못 찾았어요':'');
        if(done===pts.length) placeMarkers(L,found,miss);
      });
    });
  }).catch(function(){ box.innerHTML='<div class="map-off">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요</div>'; });
}
function placeMarkers(L,found,miss){
  if(!MAP) return;
  MAPLAYER.clearLayers();
  found.sort(function(a,b){ return a.p.day-b.p.day||a.p.n-b.p.n; });
  var byDay={}, bounds=[], num={}, lastEv={};
  found.forEach(function(f){
    var ev=f.p.ev, ty=ev.type||'sight';
    var n=num[f.p.day]=(num[f.p.day]||0)+1;
    var label=ui.mapAll?(parts(f.p.date)[2]+'·'+n):String(n);
    var icon=L.divIcon({className:'mk-wrap',html:'<div class="mk mk--'+ty+'">'+esc(label)+'</div>',iconSize:[30,30],iconAnchor:[15,15]});
    var q=evQuery(ev);
    var html='<div class="mk-pop"><b>'+esc((ev.time||'')+' '+ev.title)+'</b>'+(ui.mapAll?'<div class="mk-d">'+esc(mdw(f.p.date))+'</div>':'')+(q?'<a href="'+esc(mapUrl(q))+'" target="_blank" rel="noopener">구글 지도에서 열기</a>':'')+
      (canEdit()?'<br><a href="#" data-pop-edit="'+esc(ev.id)+'">위치가 틀렸으면 고치기</a>':'')+'</div>';
    L.marker([f.c.lat,f.c.lng],{icon:icon}).bindPopup(html).addTo(MAPLAYER);
    (byDay[f.p.day]=byDay[f.p.day]||[]).push([f.c.lat,f.c.lng]); bounds.push([f.c.lat,f.c.lng]);
  });
  Object.keys(byDay).forEach(function(k){ if(byDay[k].length>1) L.polyline(byDay[k],{color:ui.mapAll?DAYCOL[k%DAYCOL.length]:'#2E4E97',weight:3,opacity:.7,dashArray:'6 6'}).addTo(MAPLAYER); });
  if(bounds.length===1) MAP.setView(bounds[0],15); else if(bounds.length) MAP.fitBounds(bounds,{padding:[30,30]});
  var mm=document.getElementById('map-miss');
  var fb=found.filter(function(f){ return f.p.ev.map&&f.c.via&&f.c.via!=='map'; });
  function box(title,list){ return list.length?'<div class="row"><div class="row-main"><div class="row-k">'+title+'</div>'+list.map(function(p){return '<div class="row-sub">'+esc((p.ev.time||'')+' '+evName(p.ev)+(title.indexOf('검색어')>=0?' ('+p.ev.map+')':''))+'</div>';}).join('')+'</div></div>':''; }
  var h=box('지도에 못 올린 일정',miss)+box('지도 검색어로 못 찾아서 장소 이름으로 표시한 일정',fb.map(function(f){return f.p;}));
  if(mm) mm.innerHTML=h?'<div class="list">'+h+'</div>'+(fb.length?'<p class="foot">검색어를 영어나 일본어로 바꾸거나, 구글 지도에서 길게 눌러 나온 좌표를 넣어 보세요.</p>':''):'';
}

      var c=state.checklist.filter(function(x){return x.id===id;})[0]; if(!c) break;

    case 'ck-up': case 'ck-down':
      if(el.disabled) break;
      commit(function(s){ var i=-1; s.checklist.forEach(function(x,k){ if(x.id===id) i=k; }); var j=act==='ck-up'?i-1:i+1; if(i<0||j<0||j>=s.checklist.length) return; var t=s.checklist[i]; s.checklist[i]=s.checklist[j]; s.checklist[j]=t; },true); break;
    case 'ck-rename':

      openSheet('<form data-form="ck-rename" data-id="'+esc(id)+'"><h2>준비물 고치기</h2>'+field('이름','text',cc.text,'text',' required autocomplete="off"')+
        '<div class="actions"><button type="button" class="btn btn-ghost" data-act="sheet-close">취소</button><button type="submit" class="btn btn-primary">저장</button></div></form>');
      var ci=document.querySelector('.sheet input[name=text]'); if(ci) setTimeout(function(){ci.focus();ci.select();},250);
      break;

      if(armed!==id){armed=id;el.textContent='한 번 더 누르면 삭제';return;}
      armed=null; closeSheet();
      if(act==='del-ev'){ var fe=findEv(id); if(fe) markDirty('event',id,'delete',{date:state.days[fe.day].date,title:evName(fe.ev)}); commit(function(s){s.days.forEach(function(d){ var i=-1; d.items.forEach(function(x,k){ if(x.id===id) i=k; }); if(i>=0){ flagRoute(d.items[i+1]); d.items.splice(i,1); } });}); }

});
document.addEventListener('change',function(e){

/* drag to reorder checklist (touch + mouse) */
var DRAG=null;
document.addEventListener('pointerdown',function(e){
  var h=e.target.closest&&e.target.closest('[data-drag]'); if(!h) return;
  var list=h.closest('.ck-list'); if(!list) return;
  e.preventDefault();
  var rows=Array.prototype.slice.call(list.querySelectorAll('.ck-editrow')), row=h.closest('.ck-editrow');
  var sy=window.scrollY||0;
  DRAG={id:h.getAttribute('data-drag'),row:row,rows:rows,from:rows.indexOf(row),to:rows.indexOf(row),startY:e.clientY+sy,
    mids:rows.map(function(r){ var b=r.getBoundingClientRect(); return b.top+sy+b.height/2; }),h:row.getBoundingClientRect().height,pid:e.pointerId};
  row.classList.add('dragging'); list.classList.add('is-dragging');
  try{ h.setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove',function(e){
  if(!DRAG||e.pointerId!==DRAG.pid) return;
  e.preventDefault();
  if(e.clientY<90) window.scrollBy(0,-10); else if(e.clientY>window.innerHeight-130) window.scrollBy(0,10);
  var y=e.clientY+(window.scrollY||0), dy=y-DRAG.startY, mid=DRAG.mids[DRAG.from]+dy, to=DRAG.from;
  DRAG.mids.forEach(function(m,i){ if(i<DRAG.from&&mid<m) to=Math.min(to,i); if(i>DRAG.from&&mid>m) to=Math.max(to,i); });
  DRAG.to=to;
  DRAG.row.style.transform='translateY('+dy+'px)';
  DRAG.rows.forEach(function(r,i){ if(r===DRAG.row) return; var sh=0; if(DRAG.from<to&&i>DRAG.from&&i<=to) sh=-DRAG.h; if(DRAG.from>to&&i<DRAG.from&&i>=to) sh=DRAG.h; r.style.transform=sh?'translateY('+sh+'px)':''; });
},{passive:false});
function endDrag(e){
  if(!DRAG||(e&&e.pointerId!==DRAG.pid)) return;
  var d=DRAG; DRAG=null;
  d.rows.forEach(function(r){ r.style.transform=''; r.classList.remove('dragging'); });
  var list=d.row.closest('.ck-list'); if(list) list.classList.remove('is-dragging');
  if(d.to===d.from) return;
  commit(function(s){ var i=-1; s.checklist.forEach(function(x,k){ if(x.id===d.id) i=k; }); if(i<0) return; var it=s.checklist.splice(i,1)[0]; s.checklist.splice(d.to,0,it); },true);
}

document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  var kind=f.getAttribute('data-form'), id=f.getAttribute('data-id');
  var v={}; Array.prototype.forEach.call(f.elements,function(x){if(x.name) v[x.name]=x.value.trim();});
  if(!canEdit()) return;
  if(kind==='gkey'){ var gk=String(v.key||'').replace(/\s+/g,''); if(!gk) return; lsSet(LS_GKEY,gk); ggClear(); closeSheet(); render(); toast('저장했어요. 일정 탭 지도를 열어 보세요'); return; }
  if(kind==='gh-token'){ var tk=String(v.token||'').replace(/\s+/g,''); if(!tk) return; lsSet(LS_GHTOKEN,tk); closeSheet(); sharePrep(); return; }
  if(kind==='backup-text'){ if(!v.text) return; readBackup(v.text); return; }
  if(kind==='spend'){
    var amt=parseFloat(String(v.amount||'').replace(/[^0-9.]/g,'')); if(!(amt>0)){ toast('금액을 넣어 주세요'); return; }
    var cur=(f.querySelector('input[name=cur]:checked')||{}).value==='KRW'?'KRW':'JPY';
    var evId=f.getAttribute('data-ev')||'';
    SP.items.push({id:uid('s'),date:v.date||'',ev:evId,cat:v.cat||'etc',amount:amt,cur:cur,memo:v.memo||''});
    spSave(); closeSheet(); render(); toast('기록했어요 '+money(amt,cur)); return;
  }
  if(kind==='leg'){
    var la=parseFloat(String(v.amount||'').replace(/[^0-9.]/g,'')); if(!(la>0)){ toast('금액을 넣어 주세요'); return; }
    var lc=(f.querySelector('input[name=cur]:checked')||{}).value==='KRW'?'KRW':'JPY', lid=f.getAttribute('data-ev'), lf=findEv(lid); if(!lf) return;
    var ld=state.days[lf.day], lname=(prevName(ld,lf.ev)?prevName(ld,lf.ev)+' → ':'')+evName(lf.ev);
    SP.items.push({id:uid('s'),date:ld.date,ev:'',leg:lid,cat:'transit',amount:la,cur:lc,memo:'교통비 · '+lname+(v.memo?' ('+v.memo+')':'')});
    spSave(); closeSheet(); render(); toast('교통비 '+money(la,lc)+' 기록했어요'); return;
  }
  if(kind==='sp-rate'){ var r=parseFloat(String(v.rate100||'').replace(/[^0-9.]/g,'')); if(r>0){ SP.rate=r/100; spSave(); } closeSheet(); render(); return; }
  if(kind==='ck-rename'){ var rid=f.getAttribute('data-id'); if(!v.text) return; closeSheet(); commit(function(s){ s.checklist.forEach(function(x){ if(x.id===rid) x.text=v.text; }); }); return; }
  if(kind==='check'){ if(!v.text) return; commit(function(s){s.checklist.push({id:uid('c'),text:v.text,done:false});}); return; }
  if(kind==='place'){
    if(!v.name) return; closeSheet();
    var pk=f.getAttribute('data-k'), bk=id?findPl(pk,id):null;
    if(bk){ if((bk.map||'')!==v.map||bk.name!==v.name||(bk.nameOrig||'')!==v.nameOrig){ delete bk.lat; delete bk.lng; } bk.name=v.name; bk.nameOrig=v.nameOrig; bk.map=v.map; bk.memo=v.memo; bk.city=v.city; }
    else { bk={id:uid(pk==='bread'?'b':'f'),city:v.city,name:v.name,nameOrig:v.nameOrig,map:v.map,memo:v.memo}; PLD[pk].push(bk); }
    ui.plCity=ui.plCity||{}; ui.plCity[pk]=v.city;
    plSave(pk);
    // scheduled visits follow the place's name and map search
    var linked=plUses(pk,bk.id);
    commit(function(){ linked.forEach(function(u){ var ev=u.ev; if(ev.place!==bk.name||(ev.map||'')!==bk.map||(ev.placeOrig||'')!==bk.nameOrig){ delete ev.lat; delete ev.lng; flagRoute(ev); flagRoute(u.d.items[u.d.items.indexOf(ev)+1]); } ev.title=ev.place=bk.name; ev.placeOrig=bk.nameOrig; ev.map=bk.map; }); },true);
    linked.forEach(function(u){ markDirty('event',u.ev.id,'upsert'); }); markDirty('pl-'+pk,'all','upsert');
    toast('저장했어요'); return;
  }
  if(kind==='day-title'){ if(!v.title) return; var dd=state.days[ui.day]; closeSheet(); commit(function(){ dd.title=v.title; }); markDirty('day',dd.date,'upsert'); return; }
  if(kind==='ev'){
    if(!v.place) return;
    var dayIdx=+v.day; closeSheet(); ui.day=dayIdx; var savedEv=null;
    commit(function(s){
      var old=id?findEv(id):null, item=old?JSON.parse(JSON.stringify(old.ev)):{id:uid('e')};
      // place or map search changed: drop old pin so the map finds it again from the new search
      var locChanged=(item.map||'')!==v.map||(item.place||'')!==v.place||(item.placeOrig||'')!==v.placeOrig;
      if(locChanged){ delete item.lat; delete item.lng; }
      var moved=!old||locChanged||old.day!==dayIdx||(old.ev.time||'')!==v.time;
      item.time=v.time; item.type=v.type; item.title=v.place; item.place=v.place; item.placeOrig=v.placeOrig; item.map=v.map; item.memo=v.memo;
      PLK.forEach(function(k){ var P=PL[k]; if(v.type===P.ev&&v[P.fld]&&findPl(k,v[P.fld])) item[P.fld]=v[P.fld]; else delete item[P.fld]; });
      // keep the saved route (with its step diagram) unless the route fields were edited here
      var ro=item.route||{}, routeEdited=['how','min'].some(function(k){ var a=ro[k]==null?'':String(ro[k]); if(k==='how') a=howForm(a); return a!==String(v['r'+k]||''); });
      if(routeEdited){
        var keepHow=howForm(ro.how)===v.rhow?ro.how:v.rhow;
        item.route=(v.rhow||v.rmin)?Object.assign({},ro,{how:keepHow,min:v.rmin}):null;
        delete item.routeStale;
      }
      var oldDay=old?s.days[old.day]:null, oldNext=old?oldDay.items[old.idx+1]:null;
      s.days.forEach(function(d){d.items=d.items.filter(function(x){return x.id!==item.id;});});
      var target=s.days[dayIdx];
      target.items.push(item); target.items=sortItems(target.items); savedEv=item.id;
      // the way here and the way to the next stop may no longer fit
      if(moved){ if(!routeEdited) flagRoute(item); flagRoute(target.items[target.items.indexOf(item)+1]); if(oldNext&&(old.day!==dayIdx||oldDay.items.indexOf(oldNext)!==oldDay.items.indexOf(item)+1)) flagRoute(oldNext); }
    });
    if(savedEv) markDirty('event',savedEv,'upsert');
    return;
  }
  if(kind==='res'){
    if(!v.title) return;
    if(v.endDate && v.date && v.endDate<v.date) v.endDate='';
    closeSheet();
    commit(function(s){
      var prev=id?findRes(id):null;
      var r=Object.assign({},prev||{},{id:id||uid('r'),cat:v.cat,title:v.title,nameOrig:v.nameOrig,date:v.date,time:v.time,endDate:v.endDate,confirm:v.confirm,app:v.app,address:v.address,addressJa:v.addressJa,phone:v.phone,link:v.link,memo:v.memo});
      var i=-1; s.reservations.forEach(function(x,j){if(x.id===r.id) i=j;});

      markDirty('reservation',r.id,'upsert');
    });
  }
});
