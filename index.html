<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEFEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="교토오사카">
<title>교토·오사카 가족여행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --ink:#1A211E; --muted:#5E6A64; --line:#D3D9D2; --soft:#E2E6E0;
  --kyoto:#3E6A48; --osaka:#2E4E97; --accent:#C93B25;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#1A201D; --ink:#E6EBE7; --muted:#9BA69F; --line:#2B3430; --soft:#232A26;
    --kyoto:#86B791; --osaka:#90AAEE; --accent:#F06A50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#1A201D; --ink:#E6EBE7; --muted:#9BA69F; --line:#2B3430; --soft:#232A26;
  --kyoto:#86B791; --osaka:#90AAEE; --accent:#F06A50; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.serif{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--osaka);outline-offset:2px;border-radius:6px}
.main{max-width:600px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:20px;padding-right:20px}
img{max-width:100%}

/* header */
.top{padding:22px 20px 14px}
.top h1{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-0.015em;margin:0}
.top .who{margin:8px 0 0;color:var(--muted);font-size:14px}
.top .status{margin:2px 0 0;font-size:15px;font-weight:600}
.ro-note{display:inline-block;margin-top:8px;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 10px}

/* route line (day selector) */
.route{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 8px 8px;border-bottom:1px solid var(--line)}
.route-cities{display:grid;grid-template-columns:repeat(5,1fr);font-size:12px;font-weight:600;margin:0 0 8px;text-align:center}
.rc-k{grid-column:1/3;color:var(--kyoto)}
.rc-m{grid-column:3/4;color:var(--muted);font-weight:500}
.rc-o{grid-column:4/6;color:var(--osaka)}
.stations{display:grid;grid-template-columns:repeat(5,1fr)}
.st{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0 0 4px;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-height:66px}
.st::before{content:"";position:absolute;top:9px;height:5px;left:0;right:0;background:var(--seg)}
.st:first-child::before{left:50%}
.st:last-child::before{right:50%}
.st--kyoto{--seg:var(--kyoto);--mark:var(--kyoto)}
.st--osaka{--seg:var(--osaka);--mark:var(--osaka)}
.st--move{--seg:linear-gradient(90deg,var(--kyoto),var(--osaka));--mark:var(--ink)}
.st-mark{position:relative;z-index:1;width:23px;height:23px;border-radius:50%;background:var(--bg);border:4px solid var(--mark);transition:transform .18s ease,background-color .18s ease}
.st--move .st-mark{width:36px;border-radius:12px}
.st[aria-selected="true"] .st-mark{background:var(--mark);transform:scale(1.12)}
.st-d{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:21px;font-weight:700;line-height:1}
.st-w{font-size:12px;color:var(--muted);line-height:1}
.st[aria-selected="true"] .st-w{color:var(--ink);font-weight:600}
.st.is-today .st-w{color:var(--accent);font-weight:600}

/* day */
.day-head{padding:20px 20px 6px}
.day-date{margin:0;font-size:14px;color:var(--muted)}
.day-head h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:25px;line-height:1.25;margin:2px 0 0;letter-spacing:-0.01em}
.day-res{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 4px;scrollbar-width:none}
.day-res::-webkit-scrollbar{display:none}
.rchip{flex:none;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.rchip-k{color:var(--muted);font-size:13px}
.rchip.is-missing{border-style:dashed}
.rchip.is-missing::after{content:"입력 전";font-size:12px;color:var(--accent)}

.timeline{list-style:none;margin:8px 0 0;padding:4px 20px 0;position:relative}
.timeline::before{content:"";position:absolute;left:calc(20px + 54px + 10px + 8px);top:18px;bottom:18px;width:4px;border-radius:2px;background:var(--line-city)}
.day--kyoto{--line-city:var(--kyoto);--dot:var(--kyoto)}
.day--osaka{--line-city:var(--osaka);--dot:var(--osaka)}
.day--move{--line-city:linear-gradient(180deg,var(--kyoto),var(--osaka));--dot:var(--ink)}
.ev{display:grid;grid-template-columns:54px 20px 1fr;column-gap:10px;padding:9px 0}
.ev-time{text-align:right;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;padding-top:1px}
.ev-rail{display:flex;justify-content:center}
.ev-dot{position:relative;z-index:1;width:14px;height:14px;border-radius:50%;background:var(--dot);margin-top:5px;box-shadow:0 0 0 4px var(--bg)}
.ev--move .ev-dot{background:var(--bg);border:3px solid var(--dot);width:12px;height:12px;margin-top:6px}
.ev-body{min-width:0;border-radius:10px;margin:-4px -8px;padding:4px 8px}
.ev-body[role="button"]{cursor:pointer}
.ev-body[role="button"]:active{background:var(--soft)}
.ev-title{margin:0;font-size:17px;font-weight:600;line-height:1.4}
.ev--move .ev-title{font-size:15px;font-weight:500;color:var(--muted)}
.ev-memo{margin:3px 0 0;font-size:14px;color:var(--muted);line-height:1.55}
.maplink{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:14px;font-weight:500;color:var(--dot);text-decoration:none;padding:2px 0}
.day--move .maplink{color:var(--osaka)}
.maplink svg{width:14px;height:14px}
.add{display:block;margin:10px 20px 0 94px;padding:10px 14px;width:calc(100% - 114px);text-align:left;background:none;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted);font-weight:500;cursor:pointer}
.add.wide{margin:12px 0 0;width:100%}

/* pages */
.page-head{padding:24px 20px 4px}
.page-head h1{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:30px;line-height:1.15;margin:0;letter-spacing:-0.015em}
.page-head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.group-label{margin:24px 20px 8px;font-size:14px;font-weight:600;color:var(--muted)}
.list{margin:0 16px;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:54px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;text-decoration:none}
.list > .row:first-child{border-top:0}
button.row{cursor:pointer}
button.row:active,a.row:active{background:var(--soft)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;line-height:1.4}
.row-sub{font-size:14px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis}
.row-k{font-size:13px;color:var(--muted);margin-bottom:1px}
.pill{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;border:1px dashed var(--accent);color:var(--accent)}
.chev{flex:none;color:var(--muted);width:16px;height:16px}
.row-num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--osaka)}
.text-block{padding:14px 16px;white-space:pre-wrap;font-size:15px}
.text-block.empty{color:var(--muted)}
.tip-title{font-weight:600}
.tip-body{font-size:14px;color:var(--muted);margin-top:2px}

/* checklist */
.progress{margin:14px 20px 0;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--kyoto);border-radius:3px;transition:width .25s ease}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:none}
.is-done .ck{background:var(--kyoto);border-color:var(--kyoto)}
.ck svg{width:14px;height:14px;color:var(--bg);opacity:0}
.is-done .ck svg{opacity:1}
.is-done .row-title{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px;font-weight:500}
.x{flex:none;border:0;background:var(--soft);color:var(--muted);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.add-row{display:flex;gap:8px;margin:12px 16px 0}
.add-row input{flex:1}
.link-btn{background:none;border:0;color:var(--osaka);font-weight:600;cursor:pointer;padding:6px 0;font-size:15px}
.head-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--muted);font-size:12px;font-weight:500;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:30;display:none}
#sheet-root.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(10,15,12,.42)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:23px;line-height:1.3;margin:0}
.sheet .sub{margin:4px 0 16px;color:var(--muted);font-size:14px}
.kv{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:center}
.kv:first-of-type{margin-top:16px}
.kv-main{flex:1;min-width:0}
.kv-k{font-size:13px;color:var(--muted)}
.kv-v{font-size:16px;word-break:break-word;white-space:pre-wrap}
.kv-v.big{font-size:20px;font-weight:600;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.kv-v.empty{color:var(--muted)}
.mini{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.field{display:block;margin-top:14px}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:92px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;height:50px;border-radius:13px;border:0;font-weight:600;font-size:16px;cursor:pointer}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--soft);color:var(--ink)}
.btn-danger{background:none;color:var(--accent);border:1px solid var(--line);flex:0 0 auto;padding:0 18px}

/* taxi card */
.taxi{position:fixed;inset:0;z-index:50;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 26px calc(24px + env(safe-area-inset-bottom,0px));font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;cursor:pointer}
.taxi .t1{font-size:22px;margin:0 0 18px;color:#444}
.taxi .t2{font-size:34px;font-weight:700;line-height:1.3;margin:0}
.taxi .t3{font-size:24px;line-height:1.45;margin:18px 0 0;font-weight:600;word-break:break-all}
.taxi .t4{font-size:18px;margin:14px 0 0;color:#444}
.taxi .close{margin-top:auto;font-family:"IBM Plex Sans KR",sans-serif;color:#666;font-size:15px;text-align:center;padding-top:24px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:60;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media (min-width:640px){.top h1{font-size:40px}}

/* today */
.tabs-in{grid-template-columns:repeat(5,1fr)}
.today-head .status{margin:6px 0 0;font-size:15px;font-weight:600}
.today-head h1{font-size:32px}
.peek{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--muted)}
.peek span{flex:1;text-align:center}
.mini[disabled]{opacity:.35}
.mini svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.now{margin:18px 16px 0;padding:18px;border-radius:18px;background:var(--surface);border:2px solid var(--accent)}
.now-k{margin:0;color:var(--accent);font-weight:600;font-size:14px}
.now h2{font-family:"Hahmlet","AppleMyungjo","Noto Serif KR",serif;font-size:24px;line-height:1.3;margin:4px 0 0}
.now-memo{margin:8px 0 0;color:var(--muted);font-size:15px}
.next{margin:10px 16px 0;padding:14px 18px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.next-k{font-size:13px;color:var(--muted);font-weight:600}
.next-t{font-weight:600}
.hotel{margin:12px 16px 0;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.tlist{list-style:none;margin:0 16px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tev{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:16px 16px 16px 12px;border-top:1px solid var(--line)}
.tev:first-child{border-top:0}
.tev-time{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;color:var(--dot);padding-top:18px}
.tev-type{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;min-height:18px}
.tev-type b{color:var(--accent);font-weight:600}
.tev h3{margin:2px 0 0;font-size:18px;line-height:1.4}
.tev-place{margin:2px 0 0;font-size:14px;color:var(--dot);font-weight:500}
.tev-memo{margin:6px 0 0;font-size:15px;color:var(--muted)}
.tev.is-past{opacity:.5}
.tev.is-cur{background:var(--soft)}
.link-btn.small{font-size:13px;color:var(--muted);font-weight:500;margin-top:8px}

/* import */
.imp{display:grid;gap:8px;margin:16px 16px 0}
.imp-btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.imp-btn svg{flex:none;width:26px;height:26px;color:var(--osaka)}
.imp-btn b{display:block;font-weight:600}
.imp-btn small{display:block;font-size:13px;color:var(--muted);margin-top:1px}
.busy{text-align:center;padding:12px 0 0}
.busy .actions{justify-content:center}
.spin{width:36px;height:36px;margin:6px auto 16px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--osaka);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:spin 3s linear infinite!important}}
.review{margin-top:14px}
.rv{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.rv .ck{margin-top:2px}
.rv.is-on .ck{background:var(--kyoto);border-color:var(--kyoto)}
.rv.is-on .ck svg{opacity:1}
.rv:not(.is-on) .row-main{opacity:.5}
.rv-note{font-size:13px;color:var(--osaka);margin-top:6px;font-weight:500}

/* offline build */
.banner{display:flex;align-items:center;gap:10px;margin:12px 16px 0;padding:10px 14px;border-radius:12px;background:var(--soft);font-size:14px;color:var(--ink)}
.banner span{flex:1}
.foot{margin:10px 20px 0;font-size:13px;color:var(--muted)}

.sync{display:grid;gap:8px;margin:16px 16px 0}
.sync-btn{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;text-decoration:none;cursor:pointer;width:100%;color:var(--ink)}
.sync-btn:active{background:var(--soft)}
.sync-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--osaka);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;margin-top:1px}
.sync-btn b{display:block;font-weight:600}
.sync-btn small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.kv-note{font-size:14px;color:var(--muted);margin-top:1px}
textarea.short{min-height:64px}
.qr-kv{align-items:flex-start}
.qr-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.qr-th{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:pointer}
.qr-th img{width:100%;height:100%;object-fit:cover}
.qr-badge{flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--osaka)}
.qr-all{width:100%;margin-top:14px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;text-align:left;cursor:pointer;display:flex;justify-content:space-between}
.qr-all b{color:var(--osaka)}
.qrv{position:fixed;inset:0;z-index:55;background:#fff;color:#111;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.qrv-top{display:flex;align-items:flex-start;gap:12px}
.qrv-top>div{flex:1;min-width:0}
.qrv-t{font-weight:700;font-size:18px;line-height:1.35}
.qrv-n{font-size:14px;color:#666;min-height:20px}
.qrv-x{flex:none;border:0;background:#eee;color:#333;width:40px;height:40px;border-radius:50%;font-size:24px;line-height:1;cursor:pointer}
.qrv-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:12px 0}

function resForDay(date){
  var out=[];
  state.reservations.forEach(function(r){
    if(!r.date) return;
    if(r.cat==='hotel' && r.endDate){
      if(r.date===date) out.push({r:r,tag:'체크인'});
      else if(r.endDate===date) out.push({r:r,tag:'체크아웃'});
      else if(r.date<date && date<r.endDate) out.push({r:r,tag:'숙박'});
    } else if(r.date===date || (r.endDate && r.date<=date && date<=r.endDate)) out.push({r:r,tag:CAT[r.cat]||'예약'});
  });
  return out;
}

/* ---------- today ---------- */
function nowJST(){
  try{return new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(/[^\d:]/g,'');}
  catch(e){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
}
function mins(hm){var p=hm.split(':');return (+p[0])*60+(+p[1]);}
function inHow(from,to){var m=mins(to)-mins(from);if(m<=0) return '곧';var h=Math.floor(m/60),r=m%60;return (h?h+'시간 ':'')+(r?r+'분':'')+' 뒤';}
function dirUrl(q){return 'https://www.google.com/maps/dir/?api=1&travelmode=transit&destination='+encodeURIComponent(q);}
function evQuery(ev){
  if(ev.map) return ev.map;
  var hotel=null; state.reservations.forEach(function(r){if(r.cat==='hotel'&&r.title===ev.place) hotel=r;});
  if(hotel) return hotel.address||'';
  return ev.place||'';
}
function hotelTonight(date){var h=null;state.reservations.forEach(function(r){if(r.cat==='hotel'&&r.date&&r.endDate&&r.date<=date&&date<r.endDate) h=r;});return h;}

          (cur.memo?'<p class="now-memo">'+esc(cur.memo)+'</p>':'')+

  var hotel=hotelTonight(d.date), out=null;

      (r.confirm?'<div class="row-num">'+esc(confirmCodes(r.confirm))+'</div>':'<div class="row-sub">'+(isMissing(r)?'예약번호를 아직 안 넣었어요':esc(r.app))+'</div>')+'</div>'+
      (qrCount(r.id)?'<button class="mini" data-act="qr-open" data-id="'+r.id+'" data-i="0">QR</button>':'')+(r.confirm?(confirmParts(r.confirm).length>1?'<button class="mini" data-act="res-open" data-id="'+r.id+'">번호 보기</button>':'<button class="mini" data-act="copy" data-v="'+esc(confirmParts(r.confirm)[0].code)+'">복사</button>'):ICON.chev)+'</div>';

    return '<li class="tev'+(past?' is-past':'')+(isCur?' is-cur':'')+'"><div class="tev-time">'+esc(ev.time||'')+'</div><div class="tev-body">'+
      '<div class="tev-type">'+esc(TYPE[ev.type]||'')+(isCur?'<b>지금</b>':'')+(isLive&&ev===next?'<b class="nx">다음, '+esc(inHow(now,next.time))+'</b>':'')+'</div>'+
      '<h3>'+esc(ev.title)+'</h3>'+(ev.place?'<p class="tev-place">'+esc(ev.place)+'</p>':'')+
      (ev.memo?'<p class="tev-memo">'+esc(ev.memo)+'</p>':'')+routeBox(d,ev)+
      (q?'<div class="btns"><a class="mini" href="'+esc(dirUrl(q))+'" target="_blank" rel="noopener">'+ICON.nav+'길찾기</a><a class="mini" href="'+esc(mapUrl(q))+'" target="_blank" rel="noopener">'+ICON.pin+'지도</a></div>':'')+

      (canEdit()?'<button class="link-btn small" data-act="ev-edit" data-id="'+ev.id+'">고치기</button>':'')+
      '</div></li>';
  }).join('');

  return head+
    '<h2 class="group-label">하루 일정 자세히</h2><ol class="tlist day--'+d.city+'">'+items+'</ol>'+
    (canEdit()?'<div class="pad"><button class="add wide" data-act="ev-add-today" data-i="'+idx+'">이 날 일정 추가</button></div>':'')+
    (qrAllN?'<div class="pad"><button class="qr-all" data-act="qr-all">QR·바우처 모아보기 <b>'+qrAllN+'장</b></button></div>':'')+

/* ---------- QR images (kept only on this phone, in IndexedDB) ---------- */
var QR={}, qrUrls={}, qrDbP=null, qrView=null;
function qrDb(){
  if(qrDbP) return qrDbP;
  qrDbP=new Promise(function(res,rej){
    try{ var rq=indexedDB.open('kyosaka',1);
      rq.onupgradeneeded=function(){ var d=rq.result; if(!d.objectStoreNames.contains('qr')) d.createObjectStore('qr',{keyPath:'id'}); };
      rq.onsuccess=function(){res(rq.result);}; rq.onerror=function(){rej(rq.error);};
    }catch(e){rej(e);}
  });
  return qrDbP;
}
function qrTx(mode,fn){ return qrDb().then(function(d){ return new Promise(function(res,rej){ var t=d.transaction('qr',mode), st=t.objectStore('qr'), out=fn(st); t.oncomplete=function(){res(out&&out.result);}; t.onerror=function(){rej(t.error);}; }); }); }
function qrLoad(){
  return qrTx('readonly',function(st){return st.getAll();}).then(function(all){
    QR={}; (all||[]).sort(function(a,b){return a.added-b.added;}).forEach(function(q){ (QR[q.res]=QR[q.res]||[]).push(q); });
    render();
  }).catch(function(){});
}
function qrUrl(q){ if(!qrUrls[q.id]) qrUrls[q.id]=URL.createObjectURL(q.blob); return qrUrls[q.id]; }
function qrCount(id){ return (QR[id]||[]).length; }
function qrAdd(resId,files){
  var list=Array.prototype.slice.call(files||[]).filter(function(f){return /^image\//.test(f.type);});
  if(!list.length){ toast('이미지 파일을 골라 주세요'); return; }
  var now=Date.now();
  var recs=list.map(function(f,i){ return {id:uid('q'),res:resId,blob:f,added:now+i}; });
  qrTx('readwrite',function(st){ recs.forEach(function(r){st.put(r);}); }).then(function(){
    recs.forEach(function(r){ (QR[resId]=QR[resId]||[]).push(r); });
    toast('QR '+recs.length+'장을 저장했어요'); resDetail(resId); render();
  }).catch(function(){ toast('저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요'); });
}
function qrDelete(q){
  qrTx('readwrite',function(st){ st.delete(q.id); }).then(function(){
    QR[q.res]=(QR[q.res]||[]).filter(function(x){return x.id!==q.id;});
    if(qrUrls[q.id]){ URL.revokeObjectURL(qrUrls[q.id]); delete qrUrls[q.id]; }
    toast('지웠어요'); render();
    if(qrView){ qrView.list=qrView.list.filter(function(x){return x.id!==q.id;}); if(!qrView.list.length) qrClose(); else { qrView.i=Math.min(qrView.i,qrView.list.length-1); qrDraw(); } }
  });
}
function qrAllList(){ var out=[]; sortedRes().forEach(function(r){ (QR[r.id]||[]).forEach(function(q){out.push(q);}); }); return out; }
function qrOpen(list,i){ if(!list.length) return; qrView={list:list,i:i||0,armed:false}; qrDraw(); }
function qrClose(){ var el=document.querySelector('.qrv'); if(el) el.remove(); qrView=null; }
function qrDraw(){
  var v=qrView, q=v.list[v.i], r=findRes(q.res), el=document.querySelector('.qrv');
  if(!el){ el=document.createElement('div'); el.className='qrv'; el.setAttribute('role','dialog'); document.body.appendChild(el); }
  el.innerHTML='<div class="qrv-top"><div><div class="qrv-t">'+esc(r?r.title:'QR')+'</div><div class="qrv-n">'+(v.list.length>1?(v.i+1)+' / '+v.list.length:'')+'</div></div><button class="qrv-x" data-act="qr-close" aria-label="닫기">×</button></div>'+
    '<div class="qrv-img"><img src="'+qrUrl(q)+'" alt="QR 이미지"></div>'+
    '<p class="qrv-tip">화면 밝기를 최대로 올리면 잘 읽혀요</p>'+
    '<div class="qrv-btns">'+(v.list.length>1?'<button class="mini" data-act="qr-prev"'+(v.i===0?' disabled':'')+'>이전</button>':'')+
    '<button class="mini" data-act="qr-share">보내기</button><button class="mini" data-act="qr-del">'+(v.armed?'한 번 더 누르면 삭제':'삭제')+'</button>'+
    (v.list.length>1?'<button class="mini" data-act="qr-next"'+(v.i===v.list.length-1?' disabled':'')+'>다음</button>':'')+'</div>';
}
function qrShare(){
  var q=qrView&&qrView.list[qrView.i]; if(!q) return;
  var ext=(q.blob.type.split('/')[1]||'png').replace('jpeg','jpg'), r=findRes(q.res);
  try{ var f=new File([q.blob],'qr-'+(qrView.i+1)+'.'+ext,{type:q.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:r?r.title:'QR'}).catch(function(){}); return; }
  }catch(e){}
  toast('이 휴대폰에서는 보내기를 쓸 수 없어요');
}
function qrSection(r){
  var qs=QR[r.id]||[];
  return '<div class="kv qr-kv"><div class="kv-main"><div class="kv-k">QR·바우처 이미지'+(qs.length?' '+qs.length+'장':'')+'</div>'+
    (qs.length?'<div class="qr-thumbs">'+qs.map(function(q,i){return '<button class="qr-th" data-act="qr-open" data-id="'+r.id+'" data-i="'+i+'"><img src="'+qrUrl(q)+'" alt="QR '+(i+1)+'"></button>';}).join('')+'</div>':'<div class="kv-v empty">eSIM이나 바우처 QR 캡처를 넣어두면 바로 꺼내 쓸 수 있어요</div>')+
    '</div><label class="mini" style="cursor:pointer">추가<input type="file" accept="image/*" multiple data-import="qr" data-id="'+r.id+'" hidden></label></div>';
}

  openSheet('<form data-form="ev" data-id="'+(id||'')+'"><h2>'+(id?'일정 고치기':'일정 추가')+'</h2>'+
    '<div class="two">'+selectField('날짜','day',String(dayIdx),state.days.map(function(d,i){return [String(i),mdw(d.date)];}))+field('시간','time',ev.time,'time')+'</div>'+
    field('할 일','title',ev.title,'text',' required placeholder="예: 킨카쿠지 구경"')+
    selectField('종류','type',ev.type||'sight',Object.keys(TYPE).map(function(k){return [k,TYPE[k]];}))+
    field('장소 이름','place',ev.place,'text',' placeholder="화면에 보이는 이름"')+
    '<label class="field"><span>지도 검색어</span><input name="map" value="'+esc(ev.map||'')+'" placeholder="예: Kinkaku-ji"><small>영어나 일본어로 적으면 구글 지도가 더 정확하게 찾아요. 비워두면 장소 이름으로 찾아요.</small></label>'+
    areaField('메모','memo',ev.memo)+
    '<fieldset class="rt-fields"><legend>가는 길 (앞 일정 장소에서)</legend>'+
    '<div class="two">'+selectField('방법','rhow',rt.how||'',[['','없음'],['train','전철'],['bus','버스'],['walk','도보'],['taxi','택시'],['etc','기타']])+field('걸리는 시간(분)','rmin',rt.min,'number',' inputmode="numeric" min="0"')+'</div>'+
    areaField('경로','rdetail',rt.detail,'예: JR 나라선 이나리역 → 교토역 환승 → 사가노선 사가아라시야마역')+
    field('요금','rcost',rt.cost,'text',' placeholder="예: 1인 240엔"')+'</fieldset>'+
    '<div class="actions">'+(id?'<button type="button" class="btn btn-danger" data-act="del-ev" data-id="'+id+'">삭제</button>':'')+
    '<button type="button" class="btn btn-ghost" data-act="sheet-close">취소</button><button type="submit" class="btn btn-primary">저장</button></div></form>');
}

function resDetail(id){
  var r=findRes(id); if(!r) return;
  function kv(k,v,btn,big){return '<div class="kv"><div class="kv-main"><div class="kv-k">'+k+'</div><div class="kv-v'+(v?'':' empty')+(big&&v?' big':'')+'">'+esc(v||'아직 없음')+'</div></div>'+(v&&btn?btn:'')+'</div>';}
  var html='<h2>'+esc(r.title)+'</h2><p class="sub">'+catBadge(r.cat)+' '+esc(resRange(r))+'</p>'+
    (function(){var ps=confirmParts(r.confirm); if(!ps.length) return kv('예약번호','');
      return ps.map(function(p,i){return '<div class="kv"><div class="kv-main"><div class="kv-k">예약번호'+(ps.length>1?' '+(i+1):'')+'</div><div class="kv-v big">'+esc(p.code)+'</div>'+(p.note?'<div class="kv-note">'+esc(noteFmt(p.note))+'</div>':'')+'</div><button class="mini" data-act="copy" data-v="'+esc(p.code)+'">복사</button></div>';}).join('');})()+
    qrSection(r)+
    (function(){var L=appLink(r); return kv('예약한 곳',r.app,L?'<a class="mini" href="'+esc(L.url)+'" target="_blank" rel="noopener">'+(L.kind==='search'?'찾아보기':'열기')+'</a>':'');})()+
    kv('주소',r.address,'<a class="mini" href="'+esc(mapUrl(r.address))+'" target="_blank" rel="noopener">지도</a>')+
    (r.cat==='hotel'||r.addressJa?kv('일본어 주소',r.addressJa,'<button class="mini" data-act="taxi" data-id="'+r.id+'">기사님께 보여주기</button>'):'')+
    (r.phone?kv('전화',r.phone,'<a class="mini" href="tel:'+esc(r.phone.replace(/[^+\d]/g,''))+'">전화</a>'):'')+
    (r.memo?kv('메모',r.memo):'')+
    '<div class="actions"><button class="btn btn-ghost" data-act="sheet-close">닫기</button>'+(canEdit()?'<button class="btn btn-primary" data-act="res-edit" data-id="'+r.id+'">'+(isMissing(r)?'정보 넣기':'고치기')+'</button>':'')+'</div>';
  openSheet(html);
}

function resForm(id){
  var r=id?findRes(id):{cat:'food',title:'',date:state.days[ui.day].date,time:'',endDate:'',confirm:'',app:'',address:'',addressJa:'',phone:'',link:'',memo:''};
  openSheet('<form data-form="res" data-id="'+(id||'')+'"><h2>'+(id?esc(r.title):'예약 추가')+'</h2>'+
    '<div class="two">'+selectField('종류','cat',r.cat,Object.keys(CAT).map(function(k){return [k,CAT[k]];}))+field('시간','time',r.time,'time')+'</div>'+
    field('이름','title',r.title,'text',' required placeholder="예: 교토 숙소, 저녁 식당"')+
    '<div class="two">'+field('날짜','date',r.date,'date',' min="2026-10-01" max="2026-10-31"')+field('끝나는 날 (체크아웃)','endDate',r.endDate,'date',' min="2026-10-01" max="2026-10-31"')+'</div>'+
    '<label class="field"><span>예약번호</span><textarea name="confirm" class="short" autocomplete="off" autocapitalize="characters" placeholder="ABC123 (2명, HONG GILDONG, KIM MINJI)">'+esc(r.confirm||'')+'</textarea><small>번호가 여러 개면 한 줄에 하나씩, 번호 (인원, 이름) 형식으로 적어요. 예: XYZ789 (1명, HONG GILDONG)</small></label>'+
    field('예약한 곳','app',r.app,'text',' placeholder="예: 아고다, 트리니티항공, 클룩"')+
    '<label class="field"><span>예약한 곳 링크</span><input name="link" type="url" value="'+esc(r.link||'')+'" placeholder="https://"><small>비워두면 아고다, 트립닷컴처럼 잘 알려진 곳은 공식 사이트로 자동 연결돼요. 앱이 깔려 있으면 앱으로 열려요.</small></label>'+
    field('주소','address',r.address)+
    '<label class="field"><span>일본어 주소</span><textarea name="addressJa" placeholder="예약 확인 메일의 일본어 주소를 붙여넣기">'+esc(r.addressJa||'')+'</textarea><small>택시 기사님께 크게 보여드릴 수 있어요.</small></label>'+
    field('전화번호','phone',r.phone,'tel')+
    areaField('메모','memo',r.memo,'한 줄에 하나씩 항목: 내용. 예: 수하물: 위탁 15kg')+
    '<div class="actions">'+(id?'<button type="button" class="btn btn-danger" data-act="del-res" data-id="'+id+'">삭제</button>':'')+
    '<button type="button" class="btn btn-ghost" data-act="sheet-close">취소</button><button type="submit" class="btn btn-primary">저장</button></div></form>');
}

function noteForm(){
  openSheet('<form data-form="note"><h2>가족 메모</h2>'+areaField('다 같이 알아야 할 것','notes',state.notes)+
    '<div class="actions"><button type="button" class="btn btn-ghost" data-act="sheet-close">취소</button><button type="submit" class="btn btn-primary">저장</button></div></form>');
}

function showTaxi(id){
  var r=findRes(id); if(!r||!r.addressJa){toast('일본어 주소를 먼저 넣어 주세요');return;}
  var el=document.createElement('div'); el.className='taxi'; el.setAttribute('role','dialog'); el.setAttribute('data-act','taxi-close');
  el.innerHTML='<p class="t1">運転手さんへ</p><p class="t2">この住所まで<br>お願いします。</p><p class="t3">'+esc(r.addressJa)+'</p>'+
    (r.phone?'<p class="t4">TEL '+esc(r.phone)+'</p>':'')+'<p class="t4">大人5名です。</p><div class="close">화면을 누르면 닫혀요</div>';
  document.body.appendChild(el);
}

/* ---------- saving (this phone only) ---------- */
function saveLocal(){ try{ localStorage.setItem(LS_STATE, JSON.stringify(state)); return true; }catch(e){ return false; } }
function commit(mutate, quiet){
  mutate(state); render();
  if(!saveLocal()) toast('저장 공간이 부족해서 저장하지 못했어요');
  else if(!quiet) toast('저장했어요');
}
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

var toastTimer=null;
function toast(msg,stay){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},stay?6000:2200);}

function copyText(v){
  function fallback(){var ta=document.createElement('textarea');ta.value=v;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,v.length);var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'예약번호를 복사했어요':'길게 눌러 직접 복사해 주세요');}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(function(){toast('예약번호를 복사했어요');},fallback);}else fallback();
}

function sortItems(items){
  var eff='00:00';
  return items.map(function(it,i){if(it.time) eff=it.time; return {it:it,k:eff,i:i};})
    .sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:a.i-b.i;}).map(function(x){return x.it;});
}

/* ---------- events ---------- */
var armed=null;
document.addEventListener('click',function(e){
  if(e.target.closest('a')) return;
  var el=e.target.closest('[data-act]'); if(!el) return;
  var act=el.getAttribute('data-act'), id=el.getAttribute('data-id');
  if(act!=='del-ev'&&act!=='del-res') armed=null;
  switch(act){
    case 'tab': ui.tab=el.getAttribute('data-v'); ui.ckEdit=false; render(); window.scrollTo(0,0); break;
    case 'day': ui.day=+el.getAttribute('data-i'); render(); break;
    case 'tday': if(el.disabled) break; ui.tday=+el.getAttribute('data-i'); render(); window.scrollTo(0,0); break;
    case 'ev-add-today': ui.day=+el.getAttribute('data-i'); evForm(null); break;
    case 'qr-open': var ql=QR[id]||[]; qrOpen(ql,+el.getAttribute('data-i')||0); break;
    case 'qr-all': qrOpen(qrAllList(),0); break;
    case 'qr-close': qrClose(); break;
    case 'qr-prev': if(qrView&&qrView.i>0){qrView.i--;qrView.armed=false;qrDraw();} break;
    case 'qr-next': if(qrView&&qrView.i<qrView.list.length-1){qrView.i++;qrView.armed=false;qrDraw();} break;
    case 'qr-share': qrShare(); break;
    case 'qr-del': if(!qrView) break; if(!qrView.armed){qrView.armed=true;qrDraw();} else qrDelete(qrView.list[qrView.i]); break;
    case 'hint-off': hintOff=true; try{localStorage.setItem('kyosaka:hint','off');}catch(e){} render(); break;
    case 'backup-export': exportData(); break;
    case 'backup-paste':
      if(navigator.clipboard&&navigator.clipboard.readText){
        navigator.clipboard.readText().then(function(t){ if(t&&t.indexOf('"days"')>=0) readBackup(t); else pasteBackup(); },function(){ pasteBackup(); });
      } else pasteBackup();
      break;
    case 'backup-apply': if(pendingBackup){ var nb=pendingBackup; pendingBackup=null; closeSheet(); commit(function(){ state=nb; },true); ssSet('kyosaka:toast','백업을 가져왔어요'); stashUI(); setTimeout(function(){ location.reload(); },150); } break;
    case 'ev-edit': evForm(id); break;
    case 'ev-add': evForm(null); break;
    case 'res-open': resDetail(id); break;
    case 'res-edit': resForm(id); break;
    case 'res-add': resForm(null); break;
    case 'note-edit': noteForm(); break;
    case 'about': aboutSheet(id); break;
    case 'sheet-close': closeSheet(); break;
    case 'copy': copyText(el.getAttribute('data-v')); break;
    case 'taxi': showTaxi(id); break;
    case 'taxi-close': el.remove(); break;
    case 'ck-edit': ui.ckEdit=!ui.ckEdit; render(); break;
    case 'check':
      var c=state.checklist.filter(function(x){return x.id===id;})[0]; if(!c) break;
      if(mode==='readonly'){var p=personalChecks();p[id]=!isDone(c);lsSet(LS_CHECK,JSON.stringify(p));render();}
      else commit(function(s){s.checklist.forEach(function(x){if(x.id===id) x.done=!x.done;});},true);
      break;
    case 'check-del': commit(function(s){s.checklist=s.checklist.filter(function(x){return x.id!==id;});}); break;
    case 'del-ev': case 'del-res':
      if(armed!==id){armed=id;el.textContent='한 번 더 누르면 삭제';return;}
      armed=null; closeSheet();
      if(act==='del-ev') commit(function(s){s.days.forEach(function(d){d.items=d.items.filter(function(x){return x.id!==id;});});});
      else commit(function(s){s.reservations=s.reservations.filter(function(x){return x.id!==id;});});
      break;
  }
});
document.addEventListener('change',function(e){
  var inp=e.target; if(inp.matches&&inp.matches('[data-import="qr"]')){ var fs=inp.files; qrAdd(inp.getAttribute('data-id'),fs); inp.value=''; return; }
  if(!inp.matches||!inp.matches('[data-import="backup"]')) return;
  var f=inp.files&&inp.files[0]; inp.value=''; if(!f) return;
  var rd=new FileReader(); rd.onload=function(){ readBackup(String(rd.result||'')); }; rd.onerror=function(){ toast('파일을 읽지 못했어요'); }; rd.readAsText(f);
});
var qrTouch=null;
document.addEventListener('touchstart',function(e){ if(qrView&&e.target.closest('.qrv-img')) qrTouch=e.touches[0].clientX; },{passive:true});
document.addEventListener('touchend',function(e){ if(qrTouch==null||!qrView) return; var dx=e.changedTouches[0].clientX-qrTouch; qrTouch=null;
  if(dx<-50&&qrView.i<qrView.list.length-1){qrView.i++;qrView.armed=false;qrDraw();} else if(dx>50&&qrView.i>0){qrView.i--;qrView.armed=false;qrDraw();} },{passive:true});
document.addEventListener('keydown',function(e){
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'&&qrView){qrClose();return;}
  if(e.key==='Escape'){var t=document.querySelector('.taxi'); if(t) t.remove(); else closeSheet();}
});
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  var kind=f.getAttribute('data-form'), id=f.getAttribute('data-id');
  var v={}; Array.prototype.forEach.call(f.elements,function(x){if(x.name) v[x.name]=x.value.trim();});
  if(kind==='backup-text'){ if(!v.text) return; readBackup(v.text); return; }
  if(kind==='check'){ if(!v.text) return; commit(function(s){s.checklist.push({id:uid('c'),text:v.text,done:false});}); return; }
  if(kind==='note'){ closeSheet(); commit(function(s){s.notes=v.notes;}); return; }
  if(kind==='ev'){
    if(!v.title) return;
    var dayIdx=+v.day; closeSheet(); ui.day=dayIdx;
    commit(function(s){
      var old=id?findEv(id):null, item=old?JSON.parse(JSON.stringify(old.ev)):{id:uid('e')};
      item.time=v.time; item.type=v.type; item.title=v.title; item.place=v.place; item.map=v.map; item.memo=v.memo;
      item.route=(v.rhow||v.rmin||v.rdetail||v.rcost)?{how:v.rhow,min:v.rmin,detail:v.rdetail,cost:v.rcost}:null;
      s.days.forEach(function(d){d.items=d.items.filter(function(x){return x.id!==item.id;});});
      var target=s.days[dayIdx];
      target.items.push(item); target.items=sortItems(target.items);
    });
    return;
  }
  if(kind==='res'){
    if(!v.title) return;
    if(v.endDate && v.date && v.endDate<v.date) v.endDate='';
    closeSheet();
    commit(function(s){
      var r={id:id||uid('r'),cat:v.cat,title:v.title,date:v.date,time:v.time,endDate:v.endDate,confirm:v.confirm,app:v.app,address:v.address,addressJa:v.addressJa,phone:v.phone,link:v.link,memo:v.memo};
      var i=-1; s.reservations.forEach(function(x,j){if(x.id===r.id) i=j;});
      if(i>=0) s.reservations[i]=r; else s.reservations.push(r);
    });
  }
});

render();
(function(){ var t=ssGet('kyosaka:toast'); if(t){ ssDel('kyosaka:toast'); setTimeout(function(){ toast(t); },300); } })();
setInterval(function(){ if(ui.tab==='today' && !$('#sheet-root').classList.contains('open') && !document.querySelector('.taxi')) render(); },60000);
if('serviceWorker' in navigator){
  var hadCtl=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(hadCtl&&!reloaded&&!$('#sheet-root').classList.contains('open')){ reloaded=true; location.reload(); } });
  window.addEventListener('load',function(){ navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(function(r){ try{ r.update(); }catch(e){} }).catch(function(){}); });
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&navigator.serviceWorker.getRegistration) navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }); });
}
if(ui.scroll) setTimeout(function(){window.scrollTo(0,ui.scroll);},0);
})();
</script>
